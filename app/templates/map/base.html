<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>{% block title %}Fontanelle in Italia{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    {% block head %}{% endblock %}
  </head>
  <body>
    <nav class="navbar" role="navigation" aria-label="Navigazione principale">
      <a class="brand" href="{{ url_for('pages.home') }}">🚰 Fontanelle in Italia</a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Apri menu" type="button">
        <span class="hamburger" aria-hidden="true"></span>
      </button>
      <div class="nav-links" id="nav-menu" role="list">
        <a href="{{ url_for('pages.app_map') }}" role="listitem">Mappa</a>
      </div>
    </nav>
    <main>
      {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='js/nav.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
