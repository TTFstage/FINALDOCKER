{% extends "base.html" %}
{% block title %}Map - Water Fountains in Italy{% endblock %}

{% block content %}
<!-- Overlay selector -->
<div id="overlay-selector" class="overlay-selector" style="margin-bottom: 10px;">
  <label><input type="checkbox" data-overlay="stations" checked /> Fountains</label>
  <label><input type="checkbox" data-overlay="bicycle_repair" checked /> Ciclofficine</label>
  <label><input type="checkbox" data-overlay="toilets" /> Toilets</label>
  <label><input type="checkbox" data-overlay="bicycleParkings" /> Bicycle Parkings</label>

</div>

<!-- Zoom hint -->
<div id="zoom-hint" class="zoom-hint" hidden style="color: orange; font-weight: bold; margin-bottom: 10px;">
  Zoom in to see points in this area.
</div>

<!-- Navigator -->
<div id="nav-toggle-bar" style="margin-bottom: 10px;">
  <button id="nav-toggle" aria-expanded="false" aria-controls="nav-panel">
    🚴 Cycling Navigator
  </button>
</div>

<div id="nav-panel" class="hidden" style="display: none; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px;">
  <div class="nav-section">
    <strong>Route waypoints</strong>
    <div id="wp-list"></div>
  </div>

  <div class="nav-section">
    <div class="nav-row">
      <input id="wp-search-input" type="text" placeholder="Search address or place…" autocomplete="off" />
      <button id="wp-search-btn" title="Add address">➕</button>
    </div>
    <div class="nav-row nav-row-wrap">
      <button id="use-location-btn" class="nav-btn-sec">📍 Use current location</button>
      <button id="map-click-add-btn" class="nav-btn-sec">🖱️ Select point on map</button>
    </div>
  </div>

  <div class="nav-section">
    <strong>Add to route</strong>
    <div class="nav-row nav-row-wrap">
      <button id="add-nearest-fountain-btn" class="nav-btn-sec" disabled>💧 Nearest fountain</button>
      <button id="add-nearest-parking-btn" class="nav-btn-sec" disabled>🅿️ Nearest bicycle parking</button>
    </div>
  </div>

  <div class="nav-section">
    <div class="nav-row">
      <button id="calc-route-btn" class="nav-btn-primary" disabled>🗺️ Calculate route</button>
      <button id="clear-route-btn" class="nav-btn-danger">🗑️ Clear</button>
    </div>
    <p id="nav-msg" class="nav-msg"></p>
  </div>
</div>

<!-- Map -->
<div id="map" style="height: 600px; width: 100%; border: 1px solid #ccc;"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

<script src="{{ url_for('static', filename='map/js/geohash.js') }}"></script>
<script src="{{ url_for('static', filename='map/js/map.js') }}"></script>

<script>
    // Configure Leaflet to handle the navigator toggle
    document.getElementById('nav-toggle').addEventListener('click', function() {
        const panel = document.getElementById('nav-panel');
        const expanded = this.getAttribute('aria-expanded') === 'true';
        this.setAttribute('aria-expanded', !expanded);
        panel.style.display = expanded ? 'none' : 'block';
    });

    // Show group member positions if group_id is provided
    {% if group_id and members %}
        // Make sure map.js has initialized window.map and window.L
        const groupId = {{ group_id }};
        const members = [
            {% for m in members %}
            { id: {{ m.user_id }}, username: "{{ m.user.username }}" }{% if not loop.last %},{% endif %}
            {% endfor %}
        ];
        
        // Position polling
        const memberMarkers = {};
        
        function updateMemberPositions() {
            if (!window.map) return; // Wait for map to be ready
            
            members.forEach(member => {
                fetch(`/groups/${groupId}/member/${member.id}/position`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.available && data.lat && data.lng) {
                            if (!memberMarkers[member.id]) {
                                memberMarkers[member.id] = L.marker([data.lat, data.lng], {
                                    title: member.username
                                }).bindPopup(`<b>${member.username}</b>`).addTo(window.map);
                            } else {
                                memberMarkers[member.id].setLatLng([data.lat, data.lng]);
                            }
                        } else if (memberMarkers[member.id]) {
                            // If position is no longer available, we could remove the marker
                            // window.map.removeLayer(memberMarkers[member.id]);
                            // delete memberMarkers[member.id];
                        }
                    })
                    .catch(e => console.error("Error fetching position:", e));
            });
        }
        
        // Update every 5 seconds
        setInterval(updateMemberPositions, 5000);
        // First call after 1 second to give the map time to initialize
        setTimeout(updateMemberPositions, 1000);
    {% endif %}
</script>
{% endblock %}
