{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
    <h1>Benvenuto</h1>
    {% if current_user and current_user.is_authenticated %}
        <p>Ciao, {{ current_user.username }}!</p>
        <p><a href="{{ url_for('auth.me') }}">Profilo</a></p>
        <p><a href="{{ url_for('auth.list_sos_contacts') }}">Contatti SOS</a></p>
        <p><a href="{{ url_for('group.index') }}">Gruppi</a></p>
    {% else %}
        <p><a href="{{ url_for('security.login') }}">Accedi</a> | <a href="{{ url_for('security.register') }}">Registrati</a></p>
    {% endif %}
{% endblock %}
