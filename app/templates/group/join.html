{% extends "base.html" %}

{% block title %}Join Group{% endblock %}

{% block content %}
    <h1>Join with Code</h1>
    <p><a href="{{ url_for('group.index') }}">← Cancel</a></p>
    <hr>

    <form method="POST" action="">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        <p>
            <label>Group Code:</label><br>
            <input type="text" name="code" value="{{ form.code.data or '' }}" required autofocus>
            {% if form.code.errors %}<br><span style="color: red;">{% for e in form.code.errors %}{{ e }}{% endfor %}</span>{% endif %}
        </p>
        
        <button type="submit">Join</button>
    </form>
{% endblock %}
