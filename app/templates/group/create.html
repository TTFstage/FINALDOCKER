{% extends "base.html" %}

{% block title %}Crea Nuovo Gruppo - Web App{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div style="margin-bottom: 1.5rem;">
        <a href="{{ url_for('group.index') }}" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">
            ← Torna ai gruppi
        </a>
        <h1 style="font-size: 1.75rem; font-weight: 700; color: var(--text-main); margin-top: 0.5rem;">Crea un Nuovo Gruppo</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem;">
            Verrà generato automaticamente un codice univoco e un link di invito.
        </p>
    </div>

    <div class="card">
        <form method="POST" action="{{ url_for('group.create') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

            <div class="form-group">
                <label for="name" class="form-label">Nome del Gruppo *</label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    class="form-control" 
                    placeholder="Es. Team Progetto Alpha" 
                    value="{{ name|default('') }}" 
                    required 
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="description" class="form-label">Descrizione (facoltativa)</label>
                <textarea 
                    id="description" 
                    name="description" 
                    class="form-control" 
                    rows="3" 
                    placeholder="Breve descrizione sugli obiettivi o partecipanti del gruppo..."
                >{{ description|default('') }}</textarea>
            </div>

            <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
                <a href="{{ url_for('group.index') }}" class="btn btn-secondary">
                    Annulla
                </a>
                <button type="submit" class="btn btn-primary">
                    Crea Gruppo
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
