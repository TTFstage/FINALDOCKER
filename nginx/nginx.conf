user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 5m;

    upstream flask_backend {
        server web:8000;
    }

    upstream fastapi_backend {
        server fastapi:8000;
    }

    # 1. Reindirizzamento automatico da HTTP (80) ad HTTPS (443)
    server {
        listen 80;
        server_name localhost;

        return 301 https://$host$request_uri;
    }

    # 2. Server HTTPS sulla porta 443
    server {
        listen 443 ssl;
        server_name localhost;

        # Certificati reali trovati nella cartella ./nginx/certs/
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Parametri SSL consigliati per la sicurezza
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location /stream {
            proxy_pass http://fastapi_backend/stream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket / SSE support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Evita il buffering sui flussi dati
            proxy_buffering off;
            proxy_read_timeout 86400s;
        }

        location /session {
            proxy_pass http://fastapi_backend/session;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://flask_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            access_log /var/log/nginx/access.log;
            error_log /var/log/nginx/error.log;
        }
    }
}